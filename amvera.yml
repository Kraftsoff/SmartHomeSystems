# Amvera (amvera.ru): деплой tradebot как Docker-контейнера.
# Переменные окружения (TB_*) задаются во вкладке «Переменные» проекта, не в этом файле.
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest
build:
  dockerfile: Dockerfile
  skip: false
run:
  persistenceMount: /data
  containerPort: 8080
