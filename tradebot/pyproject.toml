[project]
name = "tradebot"
version = "0.1.0"
description = "Risk-first, exchange-agnostic algorithmic trading bot (backtest / paper / live)"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4", "pandas>=2.2", "numpy>=1.26", "pydantic>=2.7", "pydantic-settings>=2.3",
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27", "pyyaml>=6.0", "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
